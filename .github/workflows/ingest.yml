name: Ingest museum records
on:
  workflow_dispatch:
    inputs:
      source:
        description: Museum source
        required: true
        type: choice
        options: [met, smithsonian, all]
      limit:
        description: Successfully processed records (1-1000)
        required: true
        default: '20'
      dry_run:
        description: Validate without D1 or R2 writes
        required: true
        default: true
        type: boolean
      resume_run_id:
        description: Optional run ID to resume
        required: false
permissions:
  contents: read
concurrency:
  group: culturio-production-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE: ${{ inputs.source }}
      RECORD_LIMIT: ${{ inputs.limit }}
      DRY_RUN: ${{ inputs.dry_run }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.16.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate inputs and secrets
        shell: bash
        run: |
          [[ "$RECORD_LIMIT" =~ ^[0-9]+$ ]] && (( RECORD_LIMIT >= 1 && RECORD_LIMIT <= 1000 ))
          if [[ "$SOURCE" != "met" && -z "$SMITHSONIAN_API_KEY" ]]; then exit 1; fi
          if [[ "$DRY_RUN" != "true" ]]; then
            for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_D1_DATABASE_ID R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
              [[ -n "${!name}" ]] || { echo "Missing secret: $name"; exit 1; }
            done
          fi
      - name: Run ingestion
        shell: bash
        run: |
          args=(--source "$SOURCE" --limit "$RECORD_LIMIT")
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          [[ -n "$RESUME_RUN_ID" ]] && args+=(--resume "$RESUME_RUN_ID")
          pnpm ingest "${args[@]}" | tee ingestion.log
      - name: Write workflow summary
        if: always()
        run: |
          echo '## Culturio ingestion' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $SOURCE · Limit: $RECORD_LIMIT · Dry run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          find scripts/ingestion/reports -name '*.json' -maxdepth 1 -exec sh -c 'echo "\`\`\`json"; cat "$1"; echo "\`\`\`"' _ {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-${{ github.run_id }}
          path: |
            ingestion.log
            scripts/ingestion/reports/*.json
          if-no-files-found: warn
